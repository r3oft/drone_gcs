# ======== M1：视觉流采集（单摄像头，外侧安装） ========
stream:
  host: "192.168.43.192"                         # ESP32-S3 CameraWebServer 地址
  url: "http://192.168.43.192:81/stream"         # MJPEG 低延迟流地址（优先）
  capture_url: "http://192.168.43.192/capture"   # JPEG 抓拍地址（fallback）
  timeout_ms: 3000                               # 连接/读取超时（毫秒）
  prefer_stream: true                            # 优先使用 /stream，失败后回退 /capture
  capture_poll_interval_s: 0.0667                # fallback 轮询间隔，约 15Hz
  max_stale_s: 2.0                               # 超过该时间的旧帧视为不可用
  stream_retry_interval_s: 5.0                   # fallback 模式下重试 /stream 的间隔（秒）
  stream_fail_threshold: 5                       # MJPEG 连续 grab 失败多少次后切换 fallback

# ======== M2：YOLO-OBB 推理 ========
perception:
  weights: "weights/cargo_obb_run2/weights/best.pt"  # 权重文件路径（pickup_zone/delivery_zone 共用）
  conf_threshold: 0.6                            # NMS 置信度下限
  device: "cuda:0"                               # 推理设备
  # 任务目标映射：将 FSM 任务阶段绑定到目标类别
  task_targets:
    pickup_zone:
      cls_id: 0                                  # 取货区（蓝色胶带，~30x30cm）
    delivery_zone:
      cls_id: 1                                  # 投递区（红色胶带，~30x30cm）

# ======== M3：PD 视觉伺服控制器（按任务阶段分组） ========
servo:
  pickup_align:                                  # 取货区对准阶段参数
    axis_map: "swap_xy"                         # 实测外置摄像头安装方向：图像横向->vx，图像纵向->vy
    axis_sign: { x: 1, y: -1, yaw: -1 }         # 实测外置摄像头 y/yaw 控制符号需要反向
    kp: { x: 0.003, y: 0.003, yaw: 0.3 }
    kd: { x: 0.001, y: 0.001, yaw: 0.0 }
    deadband: { x: 30, y: 30, yaw: 0.15 }       # 取货区较大，精度要求适中
    max_vel: { x: 0.3, y: 0.3, yaw: 0.10 }      # 饱和限幅（m/s 或 rad/s）
  delivery_align:                                # 投递区对准阶段参数（规格与取货区相仿）
    axis_map: "swap_xy"
    axis_sign: { x: 1, y: -1, yaw: -1 }
    kp: { x: 0.003, y: 0.003, yaw: 0.3 }
    kd: { x: 0.001, y: 0.001, yaw: 0.0 }
    deadband: { x: 30, y: 30, yaw: 0.15 }
    max_vel: { x: 0.3, y: 0.3, yaw: 0.10 }

# ======== M4：MAVLink 通信 ========
mavlink:
  connection: "udp:192.168.4.1:14550"            # 飞控 UDP 链路
  baud: 57600                                    # 串口数传波特率（UDP 时忽略）
  heartbeat_timeout_s: 5                         # 心跳超时（秒）
  reconnect_enabled: true                        # 心跳超时后自动重连
  reconnect_max_attempts: 3                      # 每次检测触发的最大重连次数
  reconnect_backoff_s: 1.0                       # 重连退避间隔（秒）

# ======== M5：状态机 / 容错 ========
fsm:
  align_hold_time_s: 1.5                         # 对齐防抖持续时间（秒）
  target_lost_hover_s: 1.0                       # 短时丢失 → 悬停阈值
  target_lost_climb_s: 2.0                       # 长时丢失 → 爬升阈值
  climb_vz: -0.2                                 # 爬升速度（m/s，NED 下为负）
  tick_rate_hz: 15                               # 主循环频率上限

  reset_timeout_s: 30.0

mission:
  profile: "standard"
  camera_link_loss_timeout_s: 5.0
  max_flight_alt_m: 0.5
  pre_pickup_forward_m: 0.5
  pre_pickup_speed_mps: 0.2
  no_mcu_pickup_use_land_mode: false
  no_mcu_pickup_touchdown_alt_m: 0.02
  no_mcu_pickup_touchdown_hold_s: 0.6
  no_mcu_pickup_min_descend_s: 0.8
  no_mcu_pickup_descend_vz_mps: 0.12
  no_mcu_pickup_descend_timeout_s: 8.0
  no_mcu_retakeoff_climb_vz_mps: 0.10
  no_mcu_ignore_yaw_alignment: false
  no_mcu_retakeoff_delay_s: 2.0          # pickup 落地后等待飞控稳定再二次起飞
  no_mcu_retakeoff_wait_timeout_s: 12.0  # 等待解锁/稳定超时后中止任务
  no_mcu_retakeoff_require_disarmed: true

# ======== 日志系统 ========
logging:
  level: "INFO"                                  # DEBUG / INFO / WARNING / ERROR
  log_dir: "logs/"                               # 日志输出目录
  enable_flight_recorder: true                   # 是否启用飞行黑匣子

# ======== 性能监控 ========
perf:
  window_size: 30                                # 滑动窗口大小（样本数）
  enable: true                                   # 全局开关（生产环境可关闭）
  print_interval: 150                            # 每隔多少帧打印一次摘要（0 = 不自动打印）
  warn_threshold_ms: 80                          # 单帧耗时告警阈值（ms）

# ======== 图像参数（单摄像头） ========
camera:
  resolution: { w: 320, h: 240 }
  center_u: 160                                  # 光学中心 u 坐标
  center_v: 120                                  # 光学中心 v 坐标
  control_center_offset_u_px: 0.0                # 视觉伺服控制中心 u 偏置（px，右为正）
  control_center_offset_v_px: 40.0               # 视觉伺服控制中心 v 偏置（px，下为正，用于补偿左侧摄像头落地右偏）
  offset: { x: 0.0, y: 0.0 }                    # 外侧安装偏移（米），Phase 3 实测填入

# ======== 末端执行器（叉式托举机构） ========
gripper:
  channel: 9                                     # AUX 通道号
  open_pwm: 1100                                 # 张开脉宽（μs）
  close_pwm: 1900                                # 闭合脉宽（μs）

# ======== 飞行控制（FlightBridge 使用） ========
flight:
  takeoff_alt: 0.5              # 默认任务高度 (m)
  takeoff_alt_tolerance_m: 0.12 # 低空起飞到达判定容差 (m)
  land_detect_alt: 0.15         # 触地判定高度阈值 (m)
  arm_timeout_s: 10             # 解锁等待超时 (s)
  takeoff_timeout_s: 15         # 起飞等待超时 (s)
  land_timeout_s: 20            # 降落等待超时 (s)
  goto_vertical_speed: 0.15     # simple_goto altitude vertical speed (m/s)
  goto_alt_tolerance: 0.05      # simple_goto altitude tolerance (m)
  goto_command_hz: 5            # simple_goto velocity command rate

# ======== MCU 通信（MCUBridge 使用） ========
mcu:
  transport: "direct_serial"      # direct_serial / pixhawk_serial_control
  port: "/dev/ttyACM0"            # PC direct serial port for MCU
  read_timeout_s: 0.02            # non-blocking serial read timeout
  write_timeout_s: 0.5            # serial write timeout
  reset_required: false           # current fork MCU protocol only requires grab/release handshakes
  pixhawk_serial_port: 4          # legacy Pixhawk SERIAL_CONTROL UART
  serial_port: 4                 # Pico 2 所在 Pixhawk UART 号，发送时映射到 MAVLink SERIAL_CONTROL enum
  baudrate: 57600                # Pico 2 串口波特率
  grab_timeout_s: 10            # 等待 GRAB_DONE 响应超时 (s)
  release_timeout_s: 10         # 等待 RELEASE_DONE 响应超时 (s)
  retry_max: 2                  # 动作失败最大重试次数

# ======== 定距转移 ========
transfer:
  delivery_distance_m: 1.2      # 取货区到投递区预设距离 (m)
  transfer_speed: 0.3           # 转移飞行速度 (m/s)
  transfer_alt: 0.5             # 转移飞行高度 (m)
  transfer_heading_deg: 0       # 转移飞行航向 (deg)，待实测确定
